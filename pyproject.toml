[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-vision-klipper"
version = "0.1.0a1"
description = "Independent local vision-LLM tools for Klipper and Moonraker"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Local Vision contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
local-vision-console = "local_vision.server:main"
local-vision-monitor = "local_vision.monitor:main"

[tool.setuptools.packages.find]
where = ["src"]
